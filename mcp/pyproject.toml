[project]
name = "johnjoners-skills"
version = "0.1.1"
description = "Read-only MCP server over the johnjoners/skills catalogue; consumers never clone the skills repo"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
johnjoners-skills = "skills_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills_mcp"]
